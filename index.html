<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taxiva LLC | Smart Tax Filing & Planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Outfit:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          var getFetch = function() { return currentFetch; };
          var setFetch = function(v) { currentFetch = v; };

          var proto = Object.getPrototypeOf(window);
          if (proto) {
            try {
              Object.defineProperty(proto, 'fetch', {
                get: getFetch,
                set: setFetch,
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }

          try {
            Object.defineProperty(window, 'fetch', {
              get: getFetch,
              set: setFetch,
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        } catch (err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
